name: Update contribution snake
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/profile-snake.yml']
permissions:
  contents: write
concurrency:
  group: profile-snake
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Generate public contribution animation
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: Adalberto069
          outputs: |
            assets/snake.svg?palette=github-dark&color_snake=%2338d9a9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh contribution animation"
            git push origin HEAD:main
          fi
